[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexaura-linky-mcp"
version = "0.1.0"
description = "MCP Linky de NexAura : consommation électrique Enedis, en lecture seule"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<3"]

[project.optional-dependencies]
http = ["mcp>=1.10", "PyJWT[crypto]>=2.8"]
test = ["pytest>=8", "PyJWT[crypto]>=2.8"]

[project.scripts]
nexaura-linky-mcp = "nexaura_linky.server:main"

[tool.setuptools]
packages = ["nexaura_linky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
